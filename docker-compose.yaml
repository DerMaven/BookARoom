services:
  redis:
    image: redis:latest
    container_name: hotel-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "UKGarageBruv1"
    networks:
      - hotel-network
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:18.7
    container_name: hotel-postgres
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - hotel-network

  app:
    build: .
    container_name: hotel-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hotel-postgres:5432/hotel_booking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_DATA_REDIS_HOST: hotel-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: UKGarageBruv1
    depends_on:
      - postgres
      - redis
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
